[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  rweather/Crypto@0.4.0
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32dev-lab]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DTAPPROVED_CONTRACT_ID=\"contract.tapproved-b10-lab.testnet\"
