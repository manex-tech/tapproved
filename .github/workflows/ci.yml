name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax and tests
        run: npm run check
      - name: Verify no-env autonomous demo from a clean checkout
        run: npm run agent:autonomous
      - name: Verify relay starts without .env or signer credentials
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          port=43127
          PORT="$port" TAPPROVED_IDEMPOTENCY_PATH="$temp_dir/idempotency.json" \
            env -u AGENT_API_TOKEN -u NEAR_SIGNER_PRIVATE_KEY \
              -u NEAR_APPROVAL_SIGNER_PRIVATE_KEY -u NEAR_EXPIRY_SIGNER_PRIVATE_KEY \
              node relay/server.js >"$temp_dir/relay.log" 2>&1 &
          relay_pid=$!
          cleanup() {
            kill "$relay_pid" 2>/dev/null || true
            wait "$relay_pid" 2>/dev/null || true
            rm -rf "$temp_dir"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$port/health" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$port/health"
          grep -q '"event":"recovery.monitor.skipped"' "$temp_dir/relay.log"
          if grep -q 'TypeError' "$temp_dir/relay.log"; then
            cat "$temp_dir/relay.log"
            exit 1
          fi

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run contract tests
        working-directory: contract
        run: cargo test
      - name: Build contract Wasm
        working-directory: contract
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Generate Wasm checksum
        run: sha256sum contract/target/wasm32-unknown-unknown/release/tapproved_contract.wasm > contract/target/wasm32-unknown-unknown/release/SHA256SUMS.txt
      - name: Upload deployable contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapproved-contract-wasm
          path: |
            contract/target/wasm32-unknown-unknown/release/tapproved_contract.wasm
            contract/target/wasm32-unknown-unknown/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Test exact yoctoNEAR display formatting
        run: g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/test/amount_format_test.cpp -o /tmp/tapproved-amount-format-test && /tmp/tapproved-amount-format-test
      - name: Test fail-closed NVS key record policy
        run: g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/test/key_record_policy_test.cpp -o /tmp/tapproved-key-record-policy-test && /tmp/tapproved-key-record-policy-test
      - name: Test zeroizing firmware buffers
        run: g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/test/zeroizing_buffer_test.cpp -o /tmp/tapproved-zeroizing-buffer-test && /tmp/tapproved-zeroizing-buffer-test
      - name: Test duplicate serial request guard
        run: g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/test/request_id_guard_test.cpp -o /tmp/tapproved-request-id-guard-test && /tmp/tapproved-request-id-guard-test
      - name: Test firmware encoder against shared protocol vector
        run: python firmware/test/test_approval_protocol_vector.py
      - name: Test fresh debounced physical approval state machine
        run: g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/test/button_approval_test.cpp -o /tmp/tapproved-button-approval-test && /tmp/tapproved-button-approval-test
      - name: Build ESP32 firmware
        working-directory: firmware
        run: |
          pio run -e esp32dev
      - name: Generate ESP32 firmware checksum
        working-directory: firmware
        run: sha256sum .pio/build/esp32dev/firmware.bin > .pio/build/esp32dev/SHA256SUMS.txt
      - name: Upload deployable ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: tapproved-esp32-firmware
          path: |
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  near-cli-readonly:
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned near-cli-rs
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/near-cli-rs/releases/download/v0.7.4/near-cli-rs-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run every documented read-only Testnet inspection command
        shell: bash
        run: |
          set -euo pipefail
          near contract call-function as-read-only manextech.testnet get_policy json-args '{}' network-config testnet now
          utc_day="$(($(date -u +%s) / 86400))"
          near contract call-function as-read-only manextech.testnet get_daily_usage json-args "{\"utc_day\": ${utc_day}}" network-config testnet now
          near contract call-function as-read-only manextech.testnet get_payment json-args '{"payment_id": 4}' network-config testnet now
          near contract call-function as-read-only manextech.testnet get_storage_metrics json-args '{}' network-config testnet now
