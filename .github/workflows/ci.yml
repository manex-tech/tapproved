name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run contract tests
        working-directory: contract
        run: cargo test
      - name: Build contract Wasm
        working-directory: contract
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Commit generated contract lockfile
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already committed"
            exit 0
          fi
          git commit -m "chore(contract): add generated Cargo.lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload generated Cargo lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: tapproved-contract-cargo-lock
          path: contract/Cargo.lock
          if-no-files-found: error
          retention-days: 1
      - name: Generate Wasm checksum
        run: sha256sum contract/target/wasm32-unknown-unknown/release/tapproved_contract.wasm > contract/target/wasm32-unknown-unknown/release/SHA256SUMS.txt
      - name: Upload deployable contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapproved-contract-wasm
          path: |
            contract/target/wasm32-unknown-unknown/release/tapproved_contract.wasm
            contract/target/wasm32-unknown-unknown/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Build ESP32 firmware
        working-directory: firmware
        run: pio run
