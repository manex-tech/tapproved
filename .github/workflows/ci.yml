name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: near-api-js-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Commit generated lockfile to same-repository PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock NEAR SDK dependencies"
            git fetch origin "${BRANCH_NAME}"
            git rebase FETCH_HEAD
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Check JavaScript syntax
        run: npm run check

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run contract tests
        working-directory: contract
        run: cargo test
      - name: Build contract Wasm
        working-directory: contract
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Generate Wasm checksum
        run: sha256sum contract/target/wasm32-unknown-unknown/release/tapproved_contract.wasm > contract/target/wasm32-unknown-unknown/release/SHA256SUMS.txt
      - name: Upload deployable contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapproved-contract-wasm
          path: |
            contract/target/wasm32-unknown-unknown/release/tapproved_contract.wasm
            contract/target/wasm32-unknown-unknown/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Build ESP32 firmware
        working-directory: firmware
        run: |
          pio run -e esp32dev
          pio run -e esp32dev-lab
